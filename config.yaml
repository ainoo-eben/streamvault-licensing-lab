tmdb:
  api_key_env: TMDB_API_KEY
  base_url: "https://api.themoviedb.org/3"
  rate_limit_per_10s: 35
  retries: 3
  timeout_s: 30

windows:
  all_years: [1900, 2099]
  since_2000: [2000, 2099]

hit:
  min_votes: 1000
  min_rating: 7.0
  commercial_bar: "revenue > budget"

talent:
  min_films_director: 3
  min_films_actor: 5

adjusted_rating:
  m: 1000
  c: 6.0

franchise:
  min_entries_on_list: 2

data:
  input_csv: data/input/id_list.csv
  raw_dir: data/raw
  processed_dir: data/processed